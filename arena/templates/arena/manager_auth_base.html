{% load arena_extras %}<!doctype html>
<html lang="pt-BR" class="bg-zinc-950">
<head>
  {% include "arena/_head.html" %}
  <title>{% block title %}Portal da arena{% endblock %} · ArenaMatch para arenas</title>
</head>
<body class="flex min-h-screen flex-col items-center justify-center bg-zinc-950 px-4 py-12 font-sans text-zinc-100 antialiased selection:bg-lime-400 selection:text-zinc-950">
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-48 left-1/2 h-[28rem] w-[56rem] -translate-x-1/2 rounded-full bg-lime-400/10 blur-3xl"></div>
  </div>
  <div class="w-full max-w-sm">
    <a href="{% url 'inicio' %}" class="flex items-center justify-center gap-2.5">
      <span class="grid size-10 place-items-center rounded-xl bg-lime-400 text-zinc-950 neon">{% icone "bola" "size-6" %}</span>
      <span class="leading-none">
        <span class="titulo block text-xl text-white">ARENA<span class="text-lime-400">MATCH</span></span>
        <span class="mt-1 block text-xs font-semibold text-zinc-500">Portal da arena</span>
      </span>
    </a>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
