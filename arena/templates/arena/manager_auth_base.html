{% load arena_extras %}<!doctype html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal do gestor{% endblock %} · ArenaManager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23059669'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
  </style>
</head>
<body class="flex min-h-full flex-col items-center justify-center px-4 py-12 font-sans text-slate-800 antialiased">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-3">
      <span class="grid size-10 place-items-center rounded-lg bg-emerald-600 text-white">{% icone "bola" "size-6" %}</span>
      <div class="leading-tight">
        <p class="text-base font-semibold text-slate-900">ArenaManager</p>
        <p class="text-xs text-slate-500">Portal do gestor</p>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
