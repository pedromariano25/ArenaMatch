{% load arena_extras %}<!doctype html>
<html lang="pt-BR" class="bg-gray-50">
<head>
  {% include "arena/_head.html" %}
  <title>{% block title %}Portal da arena{% endblock %} · ArenaMatch para arenas</title>
</head>
<body class="flex min-h-screen flex-col items-center justify-center bg-gray-50 px-4 py-12 font-sans text-gray-900 antialiased">
  <div class="w-full max-w-sm">
    <a href="{% url 'inicio' %}" class="flex items-center justify-center gap-2.5">
      <span class="grid size-10 place-items-center rounded-xl bg-bandeira-600 text-white">{% icone "bola" "size-6" %}</span>
      <span class="leading-none">
        <span class="block text-xl font-extrabold tracking-tight">ArenaMatch</span>
        <span class="mt-1 block text-sm text-gray-500">Portal da arena</span>
      </span>
    </a>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
