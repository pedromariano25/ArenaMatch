{% load arena_extras %}<span class="relative inline-grid {{ tamanho|default:'size-10' }} shrink-0 place-items-center rounded-full bg-gradient-to-br {{ usuario|cor_avatar }} {{ texto|default:'text-sm' }} font-bold text-zinc-950 ring-2 ring-zinc-950" title="{{ usuario.nome_publico }}">{{ usuario.iniciais }}{% if mostrar_nivel and usuario.perfil %}<span class="absolute -bottom-1 -right-1 grid size-5 place-items-center rounded-full bg-zinc-950 text-[10px] font-black text-lime-300 ring-1 ring-lime-400/50">{{ usuario.perfil.nivel }}</span>{% endif %}</span>
