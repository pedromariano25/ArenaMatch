{% load arena_extras %}<span class="relative inline-grid {{ tamanho|default:'size-10' }} shrink-0 place-items-center rounded-full {{ usuario|cor_avatar }} {{ texto|default:'text-sm' }} font-bold" title="{{ usuario.nome_publico }}">{{ usuario.iniciais }}{% if mostrar_nivel and usuario.perfil %}<span class="absolute -bottom-1 -right-1 grid size-5 place-items-center rounded-full bg-gray-900 text-[10px] font-bold text-white ring-2 ring-white">{{ usuario.perfil.nivel }}</span>{% endif %}</span>
